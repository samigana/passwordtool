<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <h1> Password Tool</h1>
    <p>Generate a secure password, or check the strength of one you already have.</p>
  </header>

  <main class="container">


    <section class="card">
      <h2>Generate a password</h2>

      <div class="field">
        <label for="length">Length: <span id="lengthValue">16</span></label>
        <input type="range" id="length" min="4" max="64" value="16">
      </div>

      <div class="checkbox-grid">
        <label><input type="checkbox" id="useLower" checked> Lowercase (a-z)</label>
        <label><input type="checkbox" id="useUpper" checked> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="useDigits" checked> Numbers (0-9)</label>
        <label><input type="checkbox" id="useSpecial" checked> Special (!@#$...)</label>
        <label><input type="checkbox" id="excludeAmbiguous"> Exclude ambiguous (l, 1, I, O, 0)</label>
      </div>

      <button id="generateBtn" class="btn-primary">Generate password</button>

      <div id="generateResult" class="result hidden">
        <div class="password-row">
          <code id="generatedPassword"></code>
          <button id="copyBtn" class="btn-secondary" title="Copy to clipboard">Copy</button>
        </div>

        <div class="strength">
          <div class="strength-bar-track">
            <div id="generateStrengthBar" class="strength-bar-fill"></div>
          </div>
          <div class="strength-label">
            <span id="generateStrengthLabel"></span>
            <span id="generateEntropy" class="entropy"></span>
          </div>
        </div>
      </div>

      <p id="generateError" class="error hidden"></p>
    </section>
    <section class="card">
      <h2>Check a password's strength</h2>

      <div class="field">
        <label for="passwordInput">Enter a password</label>
        <div class="password-row">
          <input type="password" id="passwordInput" placeholder="Type a password...">
          <button id="toggleVisibilityBtn" class="btn-secondary" title="Show/hide">👁</button>
        </div>
      </div>

      <button id="rateBtn" class="btn-primary">Check strength</button>

      <div id="rateResult" class="result hidden">
        <div class="strength">
          <div class="strength-bar-track">
            <div id="rateStrengthBar" class="strength-bar-fill"></div>
          </div>
          <div class="strength-label">
            <span id="rateStrengthLabel"></span>
            <span id="rateEntropy" class="entropy"></span>
          </div>
        </div>

        <ul id="feedbackList" class="feedback-list"></ul>
      </div>
    </section>

  </main>

  <footer class="page-footer">
    <p>code generated by gana sami  </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
